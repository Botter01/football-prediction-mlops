version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: drift-postgres
    environment:
      POSTGRES_USER: drift_user
      POSTGRES_PASSWORD: drift_pass
      POSTGRES_DB: drift_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: drift-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: